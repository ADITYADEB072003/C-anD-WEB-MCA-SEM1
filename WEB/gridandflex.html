<!DOCTYPE html>
<html>
<head>
    <title>Flexbox and Grid Example</title>

    <style>
        /* FLEXBOX */
        .flex-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: nowrap;
            background-color: lightblue;
            flex-direction: column;
            padding: 20px;
        }

        .flex-box {
            background-color: blue;
            color: white;
            padding: 20px;
            margin: 5px;
        }

        /* GRID */
        .grid-container {
            display: grid;
            grid-template-columns: 100px 100px 100px;
            grid-template-rows: repeat(2, 100px);
            gap: 10px;
            background-color: lightgreen;
            padding: 20px;
        }

        .grid-box {
            background-color: green;
            color: white;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>Flexbox Example</h2>

    <div class="flex-container">
        <div class="flex-box">1</div>
        <div class="flex-box">2</div>
        <div class="flex-box">3</div>
    </div>


    <h2>Grid Example</h2>

    <div class="grid-container">
        <div class="grid-box">1</div>
        <div class="grid-box">2</div>
        <div class="grid-box">3</div>
        <div class="grid-box">4</div>
        <div class="grid-box">5</div>
        <div class="grid-box">6</div>
          <div class="grid-box">6</div>
    </div>

</body>
</html>
