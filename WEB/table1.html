<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>
</head>
<style>
    table {
        width: 20%;
        border: 2px solid black;
        border-radius: 5px;
       
        margin: 20px auto;
    }

    th, td {
        padding: 10px;
        text-align: center;
    }

    th {
        background-color: #f2f2f2;
    }
</style>
<body>

<table border="1">
    <thead>
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Marks</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>101</td>
            <td>Aditya</td>
            <td>85</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Rahul</td>
            <td>90</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Aman</td>
            <td>80</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <th colspan="2">Total Marks</th>
            <th>255</th>
        </tr>
    </tfoot>
</table>

</body>
</html>
