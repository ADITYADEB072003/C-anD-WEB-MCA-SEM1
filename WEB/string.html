<!DOCTYPE html>
<html>
<body>

<script>

let str = "  Hello JavaScript World  ";

document.write("Original: " + str + "<br>");

document.write("Length: " + str.length + "<br>");

document.write("Uppercase: " + str.toUpperCase() + "<br>");

document.write("Lowercase: " + str.toLowerCase() + "<br>");

document.write("Character: " + str.charAt(2) + "<br>");

document.write("Index: " + str.indexOf("JavaScript") + "<br>");

document.write("Includes: " + str.includes("JavaScript") + "<br>");

document.write("Slice: " + str.slice(2, 7) + "<br>");

document.write("Replace: " + str.replace("Hello", "Hi") + "<br>");

document.write("Trim: " + str.trim() + "<br>");

document.write("Split: " + str.trim().split(" ") + "<br>");

document.write("Repeat: " + "Hi ".repeat(3) + "<br>");

document.write("Concat: " + "Hello".concat(" ", "World") + "<br>");

</script>

</body>
</html>
