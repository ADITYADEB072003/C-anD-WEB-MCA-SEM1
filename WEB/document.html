<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Album</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
        }

        .album {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .photo {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 2px solid black;
        }
    </style>
</head>

<body>

    <h1>My Photo Album</h1>

    <div class="album">

        <img class="photo"
             src="https://picsum.photos/id/1015/400/300"
             onmouseover="changeImage(this)"
             onmouseout="resetImage(this)">

        <img class="photo"
             src="https://picsum.photos/id/1016/400/300"
             onmouseover="changeImage(this)"
             onmouseout="resetImage(this)">

        <img class="photo"
             src="https://picsum.photos/id/1018/400/300"
             onmouseover="changeImage(this)"
             onmouseout="resetImage(this)">

        <img class="photo"
             src="https://picsum.photos/id/1025/400/300"
             onmouseover="changeImage(this)"
             onmouseout="resetImage(this)">

        <img class="photo"
             src="https://picsum.photos/id/1035/400/300"
             onmouseover="changeImage(this)"
             onmouseout="resetImage(this)">

        <img class="photo"
             src="https://picsum.photos/id/1039/400/300"
             onmouseover="changeImage(this)"
             onmouseout="resetImage(this)">

        <img class="photo"
             src="https://picsum.photos/id/1043/400/300"
             onmouseover="changeImage(this)"
             onmouseout="resetImage(this)">

        <img class="photo"
             src="https://picsum.photos/id/1069/400/300"
             onmouseover="changeImage(this)"
             onmouseout="resetImage(this)">

    </div>

    <script>
        function changeImage(image) {
            image.style.transform = "scale(3.1)";
          
            image.style.border = "3px solid red";
        }

        function resetImage(image) {
            image.style.transform = "scale(1)";
            image.style.opacity = "0";
            image.style.border = "2px solid black";
        }
    </script>

</body>
</html>
